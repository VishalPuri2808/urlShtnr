version: '3.9'

# All sensitive values come from a .env file (see .env.example) — never hardcoded.

services:

  postgres:
    image: postgres:16-alpine
    container_name: urlshortener-postgres
    environment:
      POSTGRES_DB:       ${DB_NAME:-urlshortener}
      POSTGRES_USER:     ${DB_USER:-urlshortener}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urlshortener}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urlshortener} -d ${DB_NAME:-urlshortener}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # KRaft mode — Zookeeper not required (Kafka 3.3+)
    image: bitnami/kafka:3.7
    container_name: urlshortener-kafka
    environment:
      KAFKA_CFG_NODE_ID:                        1
      KAFKA_CFG_PROCESS_ROLES:                  broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:       1@kafka:9093
      # PLAINTEXT is for container-to-container traffic; EXTERNAL is for host access
      KAFKA_CFG_LISTENERS:                      PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE:      "true"
    ports:
      # Expose only the EXTERNAL listener to the host; internal stays container-only
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-app
    environment:
      DB_HOST:                  postgres
      DB_PORT:                  5432
      DB_NAME:                  ${DB_NAME:-urlshortener}
      DB_USER:                  ${DB_USER:-urlshortener}
      DB_PASSWORD:              ${DB_PASSWORD:-urlshortener}
      REDIS_HOST:               redis
      REDIS_PORT:               6379
      KAFKA_BOOTSTRAP_SERVERS:  kafka:9092
      SERVER_PORT:              8080
      BASE_URL:                 ${BASE_URL:-http://localhost:8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
